name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Package and checksum
        shell: powershell
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:RELEASE_REF } else { 'snapshot' }
          $zip = Join-Path $PWD "dist/OMEN-Lite-Control-$version-portable.zip"
          ./package.ps1 -ZipPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEN-Lite-Control-${{ github.ref_name }}-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OMEN Lite Control ${{ github.ref_name }}
          prerelease: false
          body: |
            - 新增可选最小化到托盘、托盘模式切换与退出。
            - 新增随模式变色的图标，PawnIO 悬浮详情显示版本与路径。
            - 设置统一保存到 config.xml，自动迁移原配置。
            - 加强 EC 回读重试，切换模式时保留灯光预设选择。
            - 优化窗口恢复重绘与布局，禁用快捷键下拉框滚轮切换。

            - Add optional minimize to tray, with mode switching and exit.
            - Add mode-colored icons and PawnIO version/path tooltips.
            - Consolidate settings into config.xml and migrate existing settings.
            - Improve EC readback retries and preserve lighting preset selection during mode changes.
            - Improve window restoration and layout; disable mouse-wheel changes in the hotkey selector.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
