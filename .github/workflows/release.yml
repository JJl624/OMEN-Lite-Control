name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Package and checksum
        shell: powershell
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:RELEASE_REF } else { 'snapshot' }
          $zip = Join-Path $PWD "dist/OMEN-Lite-Control-$version-portable.zip"
          ./package.ps1 -ZipPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEN-Lite-Control-${{ github.ref_name }}-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OMEN Lite Control ${{ github.ref_name }}
          prerelease: false
          body: |
            - 模式按钮保持当前状态，支持按模式联动灯光预设。
            - 新增 OMEN 键和自定义快捷键，支持三模式循环切换及防重复触发。
            - 加快模式切换和灯光应用，修复 EC 短暂不稳定时的回读失败。
            - 优化中英文布局、状态显示和快捷键设置。

            - Keep the current mode selected and link lighting presets to modes.
            - Add OMEN/custom hotkeys for mode cycling, with repeat protection.
            - Speed up mode and lighting changes; retry transient EC read failures.
            - Refine bilingual layout, status display and inline hotkey settings.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
