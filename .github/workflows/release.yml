name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Package and checksum
        shell: powershell
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:RELEASE_REF } else { 'snapshot' }
          $zip = Join-Path $PWD "dist/OMEN-Lite-Control-$version-portable.zip"
          ./package.ps1 -ZipPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEN-Lite-Control-${{ github.ref_name }}-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OMEN Lite Control ${{ github.ref_name }}
          prerelease: false
          body: |
            旧版本可能导致睡眠或唤醒异常，建议升级至 v0.7.0。

            - 移除硬件模式回读，改为保存最后成功请求的模式。
            - 精简界面与发行包。

            Earlier versions may cause sleep or wake problems. Upgrade to v0.7.0.

            - Replace hardware mode readback with the last successful mode request.
            - Simplify the interface and portable package.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
