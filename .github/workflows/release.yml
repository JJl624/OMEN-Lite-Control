name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Package and checksum
        shell: powershell
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:RELEASE_REF } else { 'snapshot' }
          $zip = Join-Path $PWD "dist/OMEN-Lite-Control-$version-portable.zip"
          ./package.ps1 -ZipPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEN-Lite-Control-${{ github.ref_name }}-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OMEN Lite Control ${{ github.ref_name }}
          prerelease: false
          body: |
            - 标题栏显示版本号。
            - 合并许可说明，更新内容移至 Releases。
            - 运行包移除第三方源码压缩包，源码由发行页单独提供。

            - Show the version in the title bar.
            - Consolidate license notices and move release notes to Releases.
            - Remove the dependency source archive from the portable package; source remains available on the release page.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
